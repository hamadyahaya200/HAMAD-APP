
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMAD APP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
}
header{
 background:#087f5b;
 padding:22px;
 text-align:center;
}
header h1{margin:0}
.container{
 max-width:420px;
 margin:35px auto;
 padding:20px;
}
.card{
 background:#1e293b;
 padding:25px;
 border-radius:15px;
}
input{
 width:100%;
 padding:13px;
 margin:9px 0;
 border:0;
 border-radius:8px;
 font-size:15px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:8px;
 background:#087f5b;
 color:white;
 font-size:16px;
 cursor:pointer;
}
.switch{
 text-align:center;
 color:#38bdf8;
 cursor:pointer;
 margin-top:18px;
}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>HAMAD APP 🌍</h1>
<p>Wasiliana bila mipaka</p>
</header>

<div class="container">

<div class="card" id="register">
<h2>Fungua Akaunti</h2>
<input id="fullname" placeholder="Jina kamili">
<input id="username" placeholder="Username">
 <input id="phone" type="tel" placeholder="Namba ya simu (+255...)">
<input id="email" type="email" placeholder="Barua pepe">
<input id="password" type="password" placeholder="Nenosiri">
<button onclick="registerUser()">Jisajili</button>
<p class="switch" onclick="showLogin()">Tayari una akaunti? Ingia</p>
</div>


<div class="card hidden" id="login">
  <h2>Ingia HAMAD APP</h2>

  <input id="loginEmail" type="tel" placeholder="Namba ya simu (+255...)">

  <input id="loginPassword" type="password" placeholder="Nenosiri">

  <button onclick="loginUser()">Ingia</button>

  <p class="switch" onclick="showRegister()">
    Huna akaunti? Jisajili
  </p>
</div>


<div class="card hidden" id="welcome">
  <h2>Karibu HAMAD APP 🌍</h2>
  <p id="welcomeName"></p>

  <div class="dashboard">
    <button onclick="openFeature('messages')">
      💬 Ujumbe
    </button>

    <button onclick="openFeature('media')">
      📷 Picha na Video
    </button>

    <button onclick="openFeature('calls')">
      📞 Simu za Sauti
    </button>

    <button onclick="openFeature('premium')">
      ⭐ HAMAD Premium
    </button>
  </div>

  <button onclick="logout()">Toka</button>
</div>


<div class="card hidden" id="feature">
  <h2 id="featureTitle"></h2>
  <p id="featureDescription"></p>

  <div id="chatBox" class="hidden">
    <div id="chatMessages">
      <p>Karibu HAMAD CHAT!</p>
    </div>

    <input
      id="messageInput"
      type="text"
      placeholder="Andika ujumbe wako..."
    >

    <button onclick="sendMessage()">Tuma</button>
  </div>

  <button onclick="backHome()">Rudi Nyumbani</button>
</div>

</div>

<script>

function openFeature(feature) {
  const titles = {
    messages: "💬 HAMAD CHAT",
    media: "📷 Picha na Video",
    calls: "📞 Simu za Sauti",
    premium: "⭐ HAMAD Premium"
  };

  const descriptions = {
    messages: "Karibu kwenye HAMAD CHAT.",
    media: "Hapa tutatuma picha na video.",
    calls: "Hapa tutapanga mfumo wa simu.",
    premium: "Huduma za Premium zitapatikana hapa."
  };

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("feature").classList.remove("hidden");

  document.getElementById("featureTitle").textContent = titles[feature];
  document.getElementById("featureDescription").textContent = descriptions[feature];

  document.getElementById("chatBox").classList.add("hidden");

  if (feature === "messages") {
    document.getElementById("chatBox").classList.remove("hidden");
  }
}

function backHome() {
  document.getElementById("feature").classList.add("hidden");
  document.getElementById("welcome").classList.remove("hidden");
}

function logout() {
  document.getElementById("welcome").classList.add("hidden");
  showLogin();
}

</script>

</body>
</html>
