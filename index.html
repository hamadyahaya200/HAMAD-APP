
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMAD APP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
}
header{
 background:#087f5b;
 padding:22px;
 text-align:center;
}
header h1{margin:0}
.container{
 max-width:420px;
 margin:35px auto;
 padding:20px;
}
.card{
 background:#1e293b;
 padding:25px;
 border-radius:15px;
}
input{
 width:100%;
 padding:13px;
 margin:9px 0;
 border:0;
 border-radius:8px;
 font-size:15px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:8px;
 background:#087f5b;
 color:white;
 font-size:16px;
 cursor:pointer;
}
.switch{
 text-align:center;
 color:#38bdf8;
 cursor:pointer;
 margin-top:18px;
}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>HAMAD APP 🌍</h1>
<p>Wasiliana bila mipaka</p>
</header>

<div class="container">

<div class="card" id="register">
<h2>Fungua Akaunti</h2>
<input id="fullname" placeholder="Jina kamili">
<input id="username" placeholder="Username">
 <input id="phone" type="tel" placeholder="Namba ya simu (+255...)">
<input id="email" type="email" placeholder="Barua pepe">
<input id="password" type="password" placeholder="Nenosiri">
<button onclick="registerUser()">Jisajili</button>
<p class="switch" onclick="showLogin()">Tayari una akaunti? Ingia</p>
</div>


<div class="card hidden" id="login">
  <h2>Ingia HAMAD APP</h2>

  <input id="loginEmail" type="tel" placeholder="Namba ya simu (+255...)">

  <input id="loginPassword" type="password" placeholder="Nenosiri">

  <button onclick="loginUser()">Ingia</button>

  <p class="switch" onclick="showRegister()">
    Huna akaunti? Jisajili
  </p>
</div>


<div class="card hidden" id="welcome">
  <h2>Karibu HAMAD APP 🌍</h2>
  <p id="welcomeName"></p>

  <div class="dashboard">
    <button onclick="openFeature('messages')">
      💬 Ujumbe
    </button>

    <button onclick="openFeature('media')">
      📷 Picha na Video
    </button>

    <button onclick="openFeature('calls')">
      📞 Simu za Sauti
    </button>

    <button onclick="openFeature('premium')">
      ⭐ HAMAD Premium
    </button>
  </div>

  <button onclick="logout()">Toka</button>
</div>

<div class="card hidden" id="feature">
  <h2 id="featureTitle"></h2>
  <p id="featureDescription"></p>
  <button onclick="backHome()">Rudi Nyumbani</button>
</div>

</div>

<script>
function showLogin(){
 document.getElementById("register").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}
function showRegister(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("register").classList.remove("hidden");
}
function registerUser(){
 const name = document.getElementById("fullname").value.trim();
 const username = document.getElementById("username").value.trim();
 const phone = document.getElementById("phone").value.trim();
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 if(!name || !username || !phone || !email || !password){
  alert("Jaza sehemu zote.");
  return;
 }

 if(password.length < 8){
  alert("Nenosiri liwe na angalau herufi 8.");
  return;
 }

 const users = JSON.parse(localStorage.getItem("hamadUsers") || "[]");

 if(users.some(user => user.phone === phone)){
  alert("Namba hii tayari imesajiliwa.");
  return;
 }

 users.push({name, username, phone, email, password});
 localStorage.setItem("hamadUsers", JSON.stringify(users));

 alert("Usajili wa majaribio umekamilika!");
 showLogin();
}

function loginUser(){
 const phone = document.getElementById("loginEmail").value.trim();
 const password = document.getElementById("loginPassword").value;

 const users = JSON.parse(localStorage.getItem("hamadUsers") || "[]");

 const user = users.find(
  u => u.phone === phone && u.password === password
 );

 if(!user){
  alert("Namba ya simu au nenosiri si sahihi.");
  return;
 }

 document.getElementById("login").classList.add("hidden");
 document.getElementById("welcome").classList.remove("hidden");
 document.getElementById("welcomeName").textContent = "Karibu " + user.name;
}



</script>

</body>
</html>
